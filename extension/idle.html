<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SideStage</title>
<style>
  :root { --ink: #fff4e3; --glow: #ff3d7f; --glow2: #ffb347; }
  html, body { margin: 0; height: 100%; background: #07060b; overflow: hidden; cursor: none; }
  body {
    display: grid; place-items: center;
    font-family: "Avenir Next", "Helvetica Neue", sans-serif;
    color: var(--ink);
  }
  .bg {
    position: fixed; inset: -20%;
    background:
      radial-gradient(40% 60% at 20% 30%, rgba(255, 61, 127, .35), transparent 60%),
      radial-gradient(35% 50% at 80% 70%, rgba(255, 179, 71, .30), transparent 60%),
      radial-gradient(30% 40% at 60% 20%, rgba(80, 120, 255, .25), transparent 60%);
    filter: blur(40px);
    animation: drift 18s ease-in-out infinite alternate;
  }
  @keyframes drift { to { transform: rotate(8deg) scale(1.15) translate(4%, -3%); } }
  .grain {
    position: fixed; inset: 0; opacity: .12; pointer-events: none; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
  }
  .card { position: relative; text-align: center; }
  .mic { font-size: 9vmin; line-height: 1; animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-2vmin) rotate(-6deg); } }
  h1 {
    margin: 2vmin 0 1vmin;
    font-size: 11vmin; font-weight: 800; letter-spacing: -.03em; line-height: .95;
    background: linear-gradient(90deg, var(--glow2), var(--glow), #c58bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { margin: 0; font-size: 3vmin; opacity: .7; letter-spacing: .08em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="grain"></div>
  <div class="card">
    <div class="mic">🎤</div>
    <h1 data-i18n="karaokeNight">Karaoke Night</h1>
  </div>
  <script src="idle.js"></script>
</body>
</html>
